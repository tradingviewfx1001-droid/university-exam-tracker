<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Exam Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- First-time Setup -->
        <section id="setupScreen" class="screen">

            <div class="setup-container">

                <div class="app-logo">
                    🎓
                </div>

                <h1>University Exam Tracker</h1>

                <p class="subtitle">
                    Let's set up your student profile
                </p>

                <form id="studentForm">

                    <div class="input-group">
                        <label for="firstName">First Name</label>
                        <input
                            type="text"
                            id="firstName"
                            placeholder="Enter your first name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input
                            type="text"
                            id="lastName"
                            placeholder="Enter your last name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="studentId">Student ID</label>
                        <input
                            type="text"
                            id="studentId"
                            placeholder="Enter your student ID"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="faculty">Faculty</label>
                        <input
                            type="text"
                            id="faculty"
                            placeholder="e.g. Computer Science"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="department">Department</label>
                        <input
                            type="text"
                            id="department"
                            placeholder="e.g. Software Engineering"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="academicYear">Academic Year</label>
                        <input
                            type="text"
                            id="academicYear"
                            placeholder="e.g. 2026 - 2027"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="semester">Current Semester</label>

                        <select id="semester" required>
                            <option value="">Select semester</option>
                            <option value="Semester 1">Semester 1</option>
                            <option value="Semester 2">Semester 2</option>
                            <option value="Semester 3">Semester 3</option>
                            <option value="Semester 4">Semester 4</option>
                            <option value="Semester 5">Semester 5</option>
                            <option value="Semester 6">Semester 6</option>
                            <option value="Semester 7">Semester 7</option>
                            <option value="Semester 8">Semester 8</option>
                        </select>

                    </div>

                    <button type="submit" class="primary-button">
                        Continue →
                    </button>

                </form>

            </div>

        </section>


        <!-- Dashboard -->
        <section id="dashboardScreen" class="screen hidden">

            <header class="dashboard-header">

                <div>
                    <p class="welcome-text">Welcome back 👋</p>
                    <h1 id="studentName">Student</h1>
                </div>

                <button id="profileButton" class="icon-button">
                    👤
                </button>

            </header>


            <main class="dashboard">

                <div class="student-info-card">

                    <div>
                        <span>Faculty</span>
                        <strong id="dashboardFaculty">—</strong>
                    </div>

                    <div>
                        <span>Student ID</span>
                        <strong id="dashboardId">—</strong>
                    </div>

                    <div>
                        <span>Semester</span>
                        <strong id="dashboardSemester">—</strong>
                    </div>

                </div>


                <h2>Academic Overview</h2>

                <div class="stats-grid">

                    <div class="stat-card">
                        <span>Overall Average</span>
                        <strong id="overallAverage">0</strong>
                        <small>/ 100</small>
                    </div>

                    <div class="stat-card">
                        <span>Subjects</span>
                        <strong id="subjectCount">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Passed</span>
                        <strong id="passedCount">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Failed</span>
                        <strong id="failedCount">0</strong>
                    </div>

                </div>


                <h2>Semester Progress</h2>

                <div id="semesterProgress" class="semester-progress">

                    <!-- JavaScript will create semesters here -->

                </div>


                <button id="addSubjectButton" class="primary-button">
                    + Add Subject
                </button>
                <!-- Add Subject Screen -->
<section id="subjectScreen" class="screen hidden">

    <div class="setup-container">

        <div class="app-logo">
            📚
        </div>

        <h1>Add Subject</h1>

        <p class="subtitle">
            Enter your exam marks
        </p>

        <form id="subjectForm">

            <!-- Subject Name -->
            <div class="input-group">
                <label for="subjectName">
                    Subject Name
                </label>

                <input
                    type="text"
                    id="subjectName"
                    placeholder="e.g. Computer Networks"
                    required
                >
            </div>


            <!-- Semester -->
            <div class="input-group">
                <label for="subjectSemester">
                    Semester
                </label>

                <select id="subjectSemester" required>

                    <option value="">
                        Select semester
                    </option>

                    <option value="Semester 1">
                        Semester 1
                    </option>

                    <option value="Semester 2">
                        Semester 2
                    </option>

                    <option value="Semester 3">
                        Semester 3
                    </option>

                    <option value="Semester 4">
                        Semester 4
                    </option>

                    <option value="Semester 5">
                        Semester 5
                    </option>

                    <option value="Semester 6">
                        Semester 6
                    </option>

                    <option value="Semester 7">
                        Semester 7
                    </option>

                    <option value="Semester 8">
                        Semester 8
                    </option>

                </select>

            </div>


            <!-- 20% Exam -->
            <div class="input-group">

                <label for="exam20">
                    20% Exam Marks
                </label>

                <input
                    type="number"
                    id="exam20"
                    placeholder="0 - 20"
                    min="0"
                    max="20"
                    step="1"
                    required
                >

            </div>


            <!-- Final Exam -->
            <div class="input-group">

                <label for="final80">
                    Final Exam Marks
                </label>

                <input
                    type="number"
                    id="final80"
                    placeholder="0 - 80"
                    min="0"
                    max="80"
                    step="1"
                    required
                >

            </div>


            <!-- Total Preview -->
            <div class="marks-preview">

                <span>
                    Total Marks
                </span>

                <strong id="totalPreview">
                    0 / 100
                </strong>

            </div>


            <!-- Status Preview -->
            <div
                id="statusPreview"
                class="status-preview"
            >
                Enter your marks
            </div>


            <!-- Notes -->
            <div class="input-group">

                <label for="subjectNotes">
                    Notes
                </label>

                <textarea
                    id="subjectNotes"
                    placeholder="Optional notes..."
                    rows="4"
                ></textarea>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Save Subject
            </button>


            <button
                type="button"
                id="cancelSubjectButton"
                class="secondary-button"
            >
                Cancel
            </button>

        </form>

    </div>

</section>

            </main>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
